# ---- KİRA KRİTERLERİ ----
budget_max: 40000
min_rooms: 2
allow_furnished: false
max_building_age: 20
attic_needs_elevator: true
min_sqm: 0

# ---- BİLDİRİMLER ----
send_min_score: 60
digest_min_score: 30
frequency_minutes: 60
notify: true

# ---- KONUM ----
# Şehir / ilçe / mahalle seçimleri arayüzden yapılır.
locations:
  city: ""
  districts: []
  neighborhoods: []

# ---- ÜCRETSİZ KAYNAKLAR ----
# KiralıkEv'in herkese açık, salt okunur JSON API'si.
# Emlakjet gibi otomatik bot erişimini yasaklayan siteler varsayılan kaynak değildir.
sources:
  - name: KiralıkEv (ücretsiz açık API)
    type: public_api
    url: "https://api.kiralikev.net/v1/public/listings"

# Kullanıcı tarafından eklenen herkese açık Telegram kanalları da ayarlardan eklenebilir.
exclude_words: []
prefer_words: []
detail_limit: 25
