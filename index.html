<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kira Agent</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f3f0;--mut:#666;--ac:#0b6e4f;--bd:#d8d8d4}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#222;--mut:#9a9a9a;--ac:#4cc79a;--bd:#363636}}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:920px;margin:0 auto;padding:16px}
h1{font-size:20px}h2{font-size:16px;margin-top:28px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.c{background:var(--card);border-radius:10px;padding:12px}.c b{display:block;font-size:20px}.m{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut)}input,select,button{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.bar{height:8px;background:var(--ac);border-radius:4px}.row{display:flex;align-items:center;gap:8px;margin:5px 0}.row span:first-child{width:110px;font-size:13px}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}a{color:var(--ac)}
</style></head><body>
<h1>🏡 Kira Agent</h1><div class="m" id="upd"></div>

<h2>Rapor</h2><div class="g" id="kpi"></div>
<div class="g" style="margin-top:10px"><div class="c"><b style="font-size:14px">Bölge kademesine göre</b><div id="byTier"></div></div>
<div class="c"><b style="font-size:14px">Fiyat aralığı</b><div id="byPrice"></div></div></div>
<p id="insight" class="m"></p>
<div class="t"><table><thead><tr><th>Uyum</th><th>Fiyat</th><th>Oda</th><th>Yaş</th><th>Kaynak</th><th>Detay</th></tr></thead><tbody id="top"></tbody></table></div>

<h2>Filtreler</h2>
<div class="g">
<div><label>Maks. kira (TL)</label><input id="budget_max" type="number" step="500"></div>
<div><label>Min. oda (2 = 2+1)</label><input id="min_rooms" type="number" min="1" max="6"></div>
<div><label>Maks. bina yaşı</label><input id="max_building_age" type="number"></div>
<div><label>Arama sıklığı</label><select id="frequency_minutes"><option value="60">1 saat</option><option value="180">3 saat</option><option value="360">6 saat</option><option value="720">12 saat</option></select></div>
<div><label>Telegram min. uyum (%)</label><input id="send_min_score" type="number" min="0" max="100"></div></div>
<h2>Mahalleler</h2><div class="g" id="areas"></div>
<h2>Kaydet</h2>
<div class="g"><div><label>GitHub token (sadece bu tarayıcıda saklanır)</label><input id="tok" type="password"></div>
<div><label>Repo (kullanici/repo)</label><input id="repo"></div></div>
<div class="g" style="margin-top:10px"><button onclick="save()">Ayarları kaydet</button><button class="s" onclick="runNow()">Şimdi tara</button></div><p id="msg" class="m"></p>

<script>
const $=id=>document.getElementById(id),F=["budget_max","min_rooms","max_building_age","frequency_minutes","send_min_score"];
const AREAS="sanayi mah:Sanayi:1,emniyet evleri:Emniyet Evleri:1,yesilce:Yeşilce:1,sirintepe:Şirintepe:1,celiktepe:Çeliktepe:2,gultepe:Gültepe:2,gursel:Gürsel:2,harmantepe:Harmantepe:2,hamidiye:Hamidiye:2,hurriyet:Hürriyet:2,merkez mah:Merkez:2,mimar sinan:Mimar Sinan:2,nurtepe:Nurtepe:2,ortabayir:Ortabayır:2,talatpasa:Talatpaşa:2,seyrantepe:Seyrantepe:2,caglayan:Çağlayan:2,yahya kemal:Yahya Kemal:2,telsizler:Telsizler:2,sisli:Şişli:3".split(",").map(x=>x.split(":"));
let S={};
const hdr=()=>({Authorization:"Bearer "+$("tok").value,Accept:"application/vnd.github+json"});
const tl=n=>n?n.toLocaleString("tr-TR")+" ₺":"?";
$("tok").value=localStorage.tok||"";
$("repo").value=localStorage.repo||(location.hostname.endsWith("github.io")?location.hostname.split(".")[0]+"/"+location.pathname.split("/")[1]:"");
async function load(){
 try{S=await (await fetch("settings.json?t="+Date.now())).json()}catch(e){}
 F.forEach(k=>{if(S[k]!=null)$(k).value=S[k]});
 $("areas").innerHTML=AREAS.map(([a,n,t])=>{const v=(S.areas||{})[a]??t;return `<div><label>${n}</label><select data-a="${a}">${[["0","Kapalı"],["1","1. öncelik"],["2","2. öncelik"],["3","3. öncelik"]].map(([x,y])=>`<option value="${x}" ${x==v?"selected":""}>${y}</option>`).join("")}</select></div>`}).join("");
 let R={items:[]};try{R=await (await fetch("results.json?t="+Date.now())).json()}catch(e){}
 report(R)}
function report(R){
 const it=R.items;$("upd").textContent="Son tarama: "+(R.updated||"henüz yok")+(R.errors?.length?" · ⚠️ "+R.errors.length+" kaynak hatası":"");
 const pr=it.map(i=>i.price).filter(Boolean).sort((a,b)=>a-b),med=pr.length?pr[pr.length>>1]:0;
 const best=it.filter(i=>i.score>=60).length;
 $("kpi").innerHTML=[["Toplam eşleşme",it.length],["Güçlü eşleşme (≥60)",best],["Medyan kira",tl(med)],["En düşük kira",tl(pr[0])]].map(([a,b])=>`<div class="c"><b>${b}</b><span class="m">${a}</span></div>`).join("");
 const bar=(el,rows)=>{const mx=Math.max(1,...rows.map(r=>r[1]));$(el).innerHTML=rows.map(([a,n])=>`<div class="row"><span>${a}</span><div class="bar" style="width:${n/mx*100}%"></div><span>${n}</span></div>`).join("")};
 bar("byTier",[1,2,3].map(t=>[t+". kademe",it.filter(i=>i.tier==t).length]));
 const bands=[["<30 bin",0,30e3],["30–35 bin",30e3,35e3],["35–40 bin",35e3,40e3]];
 bar("byPrice",bands.map(([n,a,b])=>[n,it.filter(i=>i.price>=a&&i.price<b).length]));
 const t1=it.filter(i=>i.tier==1);
 $("insight").textContent=it.length?`Eşleşmelerin ${Math.round(t1.length/it.length*100)}%'i 1. öncelikli mahallelerde. `+(t1.length?`Bu bölgedeki medyan kira ${tl(t1.map(i=>i.price).filter(Boolean).sort((a,b)=>a-b)[t1.length>>1])}.`:"1. öncelikli bölgede henüz ilan yok; bütçeyi veya öncelikleri gevşetmeyi düşün."):"Henüz eşleşen ilan yok.";
 $("top").innerHTML=[...it].sort((a,b)=>b.score-a.score).slice(0,15).map(i=>`<tr><td><b>%${i.score}</b></td><td>${tl(i.price)}</td><td>${i.rooms??"?"}+</td><td>${i.age??"?"}</td><td>${i.source}</td><td><a href="${i.url}" target="_blank" rel="noopener">İlana git</a><div class="m">${(i.notes||[]).slice(0,2).join(" · ")}</div></td></tr>`).join("")}
async function gh(path,opt={}){return fetch(`https://api.github.com/repos/${$("repo").value}/${path}`,{...opt,headers:hdr()})}
async function save(){
 localStorage.tok=$("tok").value;localStorage.repo=$("repo").value;
 const s={...S,areas:{}};F.forEach(k=>s[k]=+$(k).value);document.querySelectorAll("[data-a]").forEach(e=>s.areas[e.dataset.a]=+e.value);
 const g=await gh("contents/docs/settings.json"),sha=g.ok?(await g.json()).sha:undefined;
 const r=await gh("contents/docs/settings.json",{method:"PUT",body:JSON.stringify({message:"ayarlar",sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(s,null,1))))})});
 $("msg").textContent=r.ok?"✅ Kaydedildi. Bir sonraki taramada geçerli olur.":"❌ Hata: "+r.status+" (token/repo yetkisini kontrol et)"}
async function runNow(){const r=await gh("actions/workflows/agent.yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main"})});$("msg").textContent=r.ok?"▶️ Tarama başlatıldı, 1-2 dk sonra yenile.":"❌ Hata: "+r.status}
load();
</script></body></html>
